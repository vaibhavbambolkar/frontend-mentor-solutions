<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <article class="profile-card">
      <header>
        <img
          src="assets/images/avatar-jessica.jpeg"
          alt="Jessica Randall"
          class="profile-image"
        />
        <h1 class="profile-name">Jessica Randall</h1>
        <p class="profile-location">London, United Kingdom</p>
      </header>
      <p class="profile-bio">"Front-end developer and avid reader."</p>
      <nav class="profile-links">
        <ul>
          <li class="profile-link">GitHub</li>
          <li class="profile-link">Frontend Mentor</li>
          <li class="profile-link">LinkedIn</li>
          <li class="profile-link">Twitter</li>
          <li class="profile-link">Instagram</li>
        </ul>
      </nav>
    </article>

      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div> -->
  </body>
</html>
